name: Intraday Risk Update

on:
  schedule:
    # 1時間8回。2026-07-31変更: GitHubのscheduledイベントは混雑時に遅延・破棄され、
    # 特に「キリの良い分」(0・5の倍数・15・30分)は全世界のcronが集中して間引かれやすい。
    # そのため実行分を人気分から外した値に変更(コミュニティ計測に基づく緩和策・保証はない)。
    # 既存FXDaily-Levels(:13/:43)からは引き続き7分以上のバッファを維持(分ずらし運用継続)。
    # 市場時間判定はスクリプト側で行い、時間外は即終了(API消費なし)。
    - cron: "3,6,21,26,31,36,53,58 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  intraday:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run intraday batch
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: node scripts/intraday.js

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/risk-feed.json
          git diff --cached --quiet || git commit -m "intraday: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push || (git pull --rebase -X theirs origin main && git push)
